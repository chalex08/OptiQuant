[project]
name = "optiquant"
version = "0.1.0"
description = "Reproducible quantization + benchmarking pipeline for open LLMs on consumer GPUs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Chen", email = "alexanderschen08@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.11",
    "huggingface-hub>=1.26",
    "numpy>=2.4.6",
]

[project.scripts]
optiquant-ingest = "optiquant.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.10",
]

# PyTorch's default PyPI wheel may lack sm_120 (Blackwell) kernels, so pin torch to the cu128 index.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
